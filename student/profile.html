<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusBite — My Profile</title>
  <link rel="stylesheet" href="../style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="../qr-code.js"></script>
  <script src="../credentials.js"></script>
</head>
<body class="profile-page">
<script>
  if (sessionStorage.getItem('student_logged_in') !== 'true') window.location.replace('login.html');
</script>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
        <span class="logo-icon">🍽️</span>
        <div>
          <span class="logo-title">CampusBite</span>
          <span class="logo-sub">My Profile</span>
        </div>
      </a>
    </div>
    <div class="header-right">
      <div class="student-chip">
        <span class="student-avatar">🎓</span>
        <div class="student-chip-info">
          <span class="student-chip-name" id="chipName">—</span>
          <span class="student-chip-roll" id="chipRoll">—</span>
        </div>
      </div>
      <a href="index.html" class="cart-btn" style="text-decoration:none;">🍽️ Order More</a>
      <button class="logout-btn student-logout" onclick="studentLogout()" title="Logout">🚪</button>
    </div>
  </div>
</header>

<section class="profile-hero">
  <div class="profile-hero-inner">
    <div class="profile-avatar-big">🎓</div>
    <div class="profile-info">
      <h1 id="profileName">—</h1>
      <p id="profileRoll" class="profile-roll">—</p>
      <p id="profileUsername" class="profile-username">—</p>
      <div class="profile-stats">
        <div class="stat-box"><span id="statTotal">0</span><label>Orders</label></div>
        <div class="stat-box"><span id="statServed">0</span><label>Served</label></div>
        <div class="stat-box"><span id="statSpend">₹0</span><label>Spent</label></div>
      </div>
    </div>
  </div>
</section>

<section class="profile-orders">
  <div class="container">
    <div class="profile-orders-header">
      <h2>🧾 My Orders</h2>
      <div class="order-filter">
        <button class="of-btn active" onclick="filterOrders('all',this)">All</button>
        <button class="of-btn" onclick="filterOrders('pending',this)">⏳ Pending</button>
        <button class="of-btn" onclick="filterOrders('served',this)">✅ Served</button>
      </div>
    </div>
    <div class="orders-grid" id="ordersGrid">
      <div class="no-orders" id="noOrders">
        <span>🛒</span>
        <h3>No orders yet</h3>
        <p>Your confirmed orders will appear here with QR codes.</p>
        <a href="index.html" class="cart-btn" style="text-decoration:none;display:inline-flex;margin-top:8px;">Start Ordering →</a>
      </div>
    </div>
  </div>
</section>

<!-- BIG QR MODAL (For easy counter scanning) -->
<div class="modal-overlay" id="bigQRModal" style="display:none;" onclick="if(event.target===this) closeBigQRModal()">
  <div class="modal" style="max-width:440px; text-align:center;">
    <button class="modal-close" onclick="closeBigQRModal()" title="Close">✕</button>
    <h2 style="font-size:1.3rem; margin-bottom:4px;">Order QR Code</h2>
    <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:16px;">Hold this up to the counter scanner</p>
    
    <div style="display:inline-flex; padding:16px; background:#fff; border:3px solid var(--border); border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,0.12); margin-bottom:14px;">
      <div id="bigQRCode"></div>
    </div>

    <div id="bigQROrderId" style="font-family:monospace; font-weight:800; font-size:1.1rem; color:var(--secondary); margin-bottom:4px;"></div>
    <div id="bigQRStudent" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;"></div>
    <div id="bigQRItems" style="background:var(--bg); border-radius:10px; padding:10px 14px; font-size:0.85rem; color:var(--secondary); margin-bottom:18px; max-height:110px; overflow-y:auto; text-align:left;"></div>

    <div style="display:flex; gap:10px;">
      <button class="dl-btn" onclick="downloadBigQR()">⬇️ Download QR</button>
      <button class="new-order-btn" onclick="closeBigQRModal()">Done</button>
    </div>
  </div>
</div>

<footer class="footer">
  <p>CampusBite &copy; 2026 &nbsp;|&nbsp; <a href="../staff/login.html" target="_blank">🧾 Staff Portal</a></p>
</footer>

<script>
  const student = JSON.parse(sessionStorage.getItem('student_user') || '{}');

  function studentLogout() {
    if (confirm('Log out of CampusBite?')) {
      sessionStorage.removeItem('student_logged_in');
      sessionStorage.removeItem('student_user');
      window.location.replace('login.html');
    }
  }

  function initProfile() {
    document.getElementById('chipName').textContent        = student.name   || '—';
    document.getElementById('chipRoll').textContent        = student.rollNo || '—';
    document.getElementById('profileName').textContent     = student.name   || '—';
    document.getElementById('profileRoll').textContent     = `Roll No: ${student.rollNo || '—'}`;
    document.getElementById('profileUsername').textContent = `@${student.username || '—'}`;
  }

  let allOrders     = [];
  let currentFilter = 'all';
  const activeSSEs  = {};

  // Helper to ensure every order has compact ASCII payload for cross-device scanning
  function getOrderQRPayload(order) {
    return JSON.stringify({
      cb: "1",
      id: order.orderId,
      s: order.student || 'Student',
      r: order.studentRollNo || '',
      items: (order.items || []).map(i => ({ n: i.name, q: i.qty, p: i.price })),
      tot: Math.round(order.total || 0),
      t: order.placedAt || new Date().toISOString()
    });
  }

  function loadOrders() {
    allOrders = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('order_ORD-')) continue;
      try {
        const o = JSON.parse(localStorage.getItem(key));
        if (!student.username || o.studentUsername === student.username || !o.studentUsername) {
          allOrders.push(o);
        }
      } catch(e) {}
    }
    allOrders.sort((a,b) => new Date(b.placedAt) - new Date(a.placedAt));
    updateStatsAndRender();
    checkPendingOrdersStatus();
  }

  function updateStatsAndRender() {
    const totalSpend = allOrders.reduce((s,o) => s + (o.total||0), 0);
    const served     = allOrders.filter(o => o.status === 'served').length;
    document.getElementById('statTotal').textContent  = allOrders.length;
    document.getElementById('statServed').textContent = served;
    document.getElementById('statSpend').textContent  = `₹${Math.round(totalSpend)}`;

    const filtered = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);
    renderOrders(filtered);
  }

  function filterOrders(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.of-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    updateStatsAndRender();
  }

  function renderOrders(orders) {
    const grid  = document.getElementById('ordersGrid');
    const empty = document.getElementById('noOrders');
    if (orders.length === 0) {
      grid.innerHTML = '';
      grid.appendChild(empty);
      empty.style.display = 'block';

      const emptyTitle = empty.querySelector('h3');
      const emptyDesc  = empty.querySelector('p');
      if (currentFilter === 'pending') {
        if (emptyTitle) emptyTitle.textContent = 'No pending orders';
        if (emptyDesc)  emptyDesc.textContent  = 'All your orders have been served! Check the "Served" tab.';
      } else if (currentFilter === 'served') {
        if (emptyTitle) emptyTitle.textContent = 'No served orders yet';
        if (emptyDesc)  emptyDesc.textContent  = 'Show your pending order QR at the counter to collect your food.';
      } else {
        if (emptyTitle) emptyTitle.textContent = 'No orders yet';
        if (emptyDesc)  emptyDesc.textContent  = 'Your confirmed orders will appear here with QR codes.';
      }
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = orders.map((o,idx) => {
      const isServed = o.status === 'served';
      const placedAt = new Date(o.placedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const servedAt = o.servedAt ? new Date(o.servedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : null;
      const itemsList = (o.items || []).map(i => `<span class="recap-item">${i.emoji || '🍽️'} ${i.name} ×${i.qty}</span>`).join('');
      return `
        <div class="order-history-card ${isServed?'served':'pending'}" id="card-${o.orderId}">
          <div class="ohc-header">
            <div><div class="ohc-id">${o.orderId}</div><div class="ohc-date">${placedAt}</div></div>
            <span class="ohc-status ${isServed?'served':'pending'}">${isServed?'✅ Served':'⏳ Pending'}</span>
          </div>
          <div class="ohc-items">${itemsList}</div>
          <div class="ohc-qr-row">
            <div class="ohc-qr-wrap" onclick="openBigQR('${o.orderId}')" title="Click to enlarge QR">
              <div id="qr-${idx}" class="ohc-qr"></div>
              <p class="qr-label">🔍 Tap to enlarge</p>
            </div>
            <div class="ohc-meta">
              <div class="ohc-total">₹${Math.round(o.total)}</div>
              ${servedAt ? `<div class="ohc-served-at">Served at ${servedAt}</div>` : ''}
              ${o.servedBy ? `<div class="ohc-served-by">By ${o.servedBy}</div>` : ''}
              <button class="view-big-qr-btn" onclick="openBigQR('${o.orderId}')">🔍 View QR (Bigger)</button>
              <button class="dl-qr-btn" onclick="downloadOrderQR(${idx},'${o.orderId}')">⬇️ Download QR</button>
            </div>
          </div>
        </div>`;
    }).join('');

    // Render clean SVG QR codes into each card
    orders.forEach((o,idx) => {
      const container = document.getElementById(`qr-${idx}`);
      if (!container) return;
      CampusBiteQR.render(container, getOrderQRPayload(o), 120);
    });
  }

  // ─── APPLY SERVED STATUS & MOVE TO SERVED SECTION ────────────
  function applyOrderServed(orderId, servedAt, servedBy) {
    let order = allOrders.find(o => o.orderId === orderId);

    if (!order) {
      const local = localStorage.getItem(`order_${orderId}`);
      if (local) {
        try {
          order = JSON.parse(local);
          allOrders.unshift(order);
        } catch(e) {}
      }
    }

    if (!order) return;

    // Check if already marked served
    if (order.status === 'served') return;

    order.status   = 'served';
    order.servedAt = servedAt || new Date().toISOString();
    order.servedBy = servedBy || 'Staff';

    // Persist to localStorage
    try {
      localStorage.setItem(`order_${orderId}`, JSON.stringify(order));
    } catch(e) {}

    // Update Big QR modal if open for this order
    if (activeBigOrderId === orderId) {
      const studentEl = document.getElementById('bigQRStudent');
      if (studentEl) {
        const timeStr = new Date(order.servedAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        studentEl.innerHTML = `${order.student}${order.studentRollNo ? ' • ' + order.studentRollNo : ''}
          <div style="margin-top:6px; color:#22543d; background:#c6f6d5; padding:6px 10px; border-radius:8px; font-weight:700;">
            ✅ Served at ${timeStr} by ${order.servedBy}!
          </div>`;
      }
    }

    // Refresh display (moves item to Served section or updates badge)
    updateStatsAndRender();

    // Audio & Toast Notification
    playChime();
    showStudentToast(`🎉 Order <strong>${orderId}</strong> has been marked as <strong>SERVED</strong>! Enjoy your meal!`, 'success');
  }

  // ─── AUDIO NOTIFICATION CHIME ────────────────────────────────
  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(587.33, ctx.currentTime);
      gain1.gain.setValueAtTime(0.2, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start();
      osc1.stop(ctx.currentTime + 0.25);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
      gain2.gain.setValueAtTime(0.25, ctx.currentTime + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime + 0.15);
      osc2.stop(ctx.currentTime + 0.5);
    } catch(e) {}
    if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
  }

  // ─── FLOATING TOAST NOTIFICATION ─────────────────────────────
  function showStudentToast(msg, type = 'success') {
    let t = document.getElementById('studentToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'studentToast';
      t.style.cssText = `
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
        padding: 16px 26px; border-radius: 50px; font-family: 'Poppins', sans-serif;
        font-size: 0.95rem; font-weight: 600; z-index: 99999;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; align-items: center; gap: 10px; max-width: 90%; text-align: center;
      `;
      document.body.appendChild(t);
    }
    t.style.background = type === 'warn' ? '#e53e3e' : '#22543d';
    t.style.color = '#fff';
    t.innerHTML = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 4500);
  }

  // ─── TIER 1: SAME-DEVICE INSTANT SYNC (BROADCAST & STORAGE) ──
  try {
    const syncChannel = new BroadcastChannel('campusbite_sync');
    syncChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'ORDER_SERVED') {
        applyOrderServed(event.data.orderId, event.data.servedAt, event.data.servedBy);
      }
    };
  } catch(e) {}

  window.addEventListener('storage', (e) => {
    if (!e.newValue) return;
    if (e.key === 'campusbite_last_served') {
      try {
        const d = JSON.parse(e.newValue);
        if (d && d.orderId) applyOrderServed(d.orderId, d.servedAt, d.servedBy);
      } catch(err) {}
    }
    if (e.key && e.key.startsWith('order_ORD-')) {
      try {
        const d = JSON.parse(e.newValue);
        if (d && d.status === 'served') applyOrderServed(d.orderId, d.servedAt, d.servedBy);
      } catch(err) {}
    }
  });

  // ─── TIER 2 & 3: CROSS-DEVICE SYNC (GO BACKEND & NTFY.SH) ────
  function watchPendingOrder(orderId) {
    const cleanId = String(orderId).replace(/[^a-zA-Z0-9]/g, '');
    if (activeSSEs[cleanId]) return;
    try {
      const sse = new EventSource(`https://ntfy.sh/campusbite_ord_${cleanId}/sse`);
      sse.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.message) {
            const payload = typeof data.message === 'string' ? JSON.parse(data.message) : data.message;
            if (payload && payload.status === 'served') {
              applyOrderServed(orderId, payload.servedAt, payload.servedBy);
              sse.close();
              delete activeSSEs[cleanId];
            }
          }
        } catch(err) {}
      };
      sse.onerror = () => { /* fallback polling continues */ };
      activeSSEs[cleanId] = sse;
    } catch(e) {}
  }

  async function checkPendingOrdersStatus() {
    const pending = allOrders.filter(o => o.status === 'pending');
    if (pending.length === 0) return;

    for (const o of pending) {
      watchPendingOrder(o.orderId);

      // 1. Check Go Backend API if connected
      if (typeof API_URL !== 'undefined' && API_URL) {
        try {
          const res = await fetch(`${API_URL}/api/orders/${o.orderId}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.status === 'served') {
              applyOrderServed(o.orderId, data.servedAt, data.servedBy);
              continue;
            }
          }
        } catch(e) {}
      }

      // 2. Poll ntfy.sh (Cross-device GitHub Pages relay fallback)
      const cleanId = String(o.orderId).replace(/[^a-zA-Z0-9]/g, '');
      try {
        const res = await fetch(`https://ntfy.sh/campusbite_ord_${cleanId}/json?poll=1`);
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split('\n');
          for (const line of lines) {
            if (!line) continue;
            try {
              const parsed = JSON.parse(line);
              const msgData = typeof parsed.message === 'string' ? JSON.parse(parsed.message) : parsed.message;
              if (msgData && msgData.status === 'served') {
                applyOrderServed(o.orderId, msgData.servedAt, msgData.servedBy);
                break;
              }
            } catch(err) {}
          }
        }
      } catch(e) {}
    }
  }

  // Poll for updates every 2.5 seconds
  setInterval(checkPendingOrdersStatus, 2500);

  /* ── BIG QR MODAL ── */
  let activeBigOrderId = null;

  function openBigQR(orderId) {
    const order = allOrders.find(o => o.orderId === orderId);
    if (!order) return;
    activeBigOrderId = orderId;

    const isServed = order.status === 'served';
    document.getElementById('bigQROrderId').textContent = order.orderId;
    let studentHtml = `${order.student}${order.studentRollNo ? ' • ' + order.studentRollNo : ''}`;
    if (isServed) {
      const timeStr = order.servedAt ? new Date(order.servedAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
      studentHtml += `<div style="margin-top:6px; color:#22543d; background:#c6f6d5; padding:6px 10px; border-radius:8px; font-weight:700;">
        ✅ Served${timeStr ? ' at ' + timeStr : ''}${order.servedBy ? ' by ' + order.servedBy : ''}!
      </div>`;
    }
    document.getElementById('bigQRStudent').innerHTML = studentHtml;
    document.getElementById('bigQRItems').innerHTML    = (order.items || []).map(i => `${i.emoji || '🍽️'} <strong>${i.name}</strong> × ${i.qty}`).join('<br>');

    // Open modal first
    document.getElementById('bigQRModal').style.display = 'flex';

    // Render large 260px QR Code SVG
    const qrBox = document.getElementById('bigQRCode');
    CampusBiteQR.render(qrBox, getOrderQRPayload(order), 260);
  }

  function closeBigQRModal() {
    document.getElementById('bigQRModal').style.display = 'none';
  }

  function downloadSVGAsPNG(svgElement, filename) {
    if (!svgElement) return;
    const svgData = new XMLSerializer().serializeToString(svgElement);
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 400;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = function() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 400, 400);
      ctx.drawImage(img, 0, 0, 400, 400);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
  }

  function downloadBigQR() {
    const svg = document.querySelector('#bigQRCode svg');
    if (svg) downloadSVGAsPNG(svg, `order-${activeBigOrderId || 'qr'}.png`);
  }

  function downloadOrderQR(idx, orderId) {
    const svg = document.querySelector(`#qr-${idx} svg`);
    if (svg) downloadSVGAsPNG(svg, `order-${orderId}.png`);
  }

  initProfile();
  loadOrders();
</script>
</body>
</html>
